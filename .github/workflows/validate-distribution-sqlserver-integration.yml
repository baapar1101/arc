name: Validate distribution SQL Server transaction locks

on:
  push:
    branches:
      - integration/resolve-hesabix-conflicts-20261102
    paths:
      - 'hesabixAPI/app/services/distribution_service.py'
      - 'hesabixAPI/app/services/distribution_field_ops_service.py'
      - 'hesabixAPI/app/services/distribution_phase3_service.py'
      - 'hesabixAPI/app/services/goods_expense_income_service.py'
      - 'hesabixAPI/tests/test_distribution_sqlserver_live_lock.py'
      - 'hesabixAPI/tests/test_distribution_sqlserver_live_migration.py'
      - 'hesabixAPI/tests/test_distribution_setup_wizard_live_sqlserver.py'
      - 'hesabixAPI/tests/test_goods_post_row_lock.py'
      - 'hesabixAPI/migrations/versions/20261121_000001_distribution_daily_plan_locks.py'
      - 'hesabixAPI/migrations/versions/20261121_000002_distribution_daily_plan_snapshot.py'
      - '.github/workflows/validate-distribution-sqlserver-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-mssql-locks:
    name: Live SQL Server 2022 business-scoped locking
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Ephemeral CI-only container. No credentials or databases from production.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: 'Ephemeral-Db2026-Only'
        ports:
          - 1433:1433

    env:
      DISTRIBUTION_MSSQL_TEST_ENABLE: '1'
      DISTRIBUTION_MSSQL_TEST_DSN: 'mssql+pymssql://sa:Ephemeral-Db2026-Only@localhost:1433/tempdb'

    defaults:
      run:
        working-directory: hesabixAPI

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hesabixAPI/pyproject.toml

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Wait for isolated SQL Server to become ready
        run: |
          python - <<'PY'
          import os
          import time
          import sqlalchemy as sa

          engine = sa.create_engine(
              os.environ["DISTRIBUTION_MSSQL_TEST_DSN"],
              pool_pre_ping=True,
          )
          try:
              for attempt in range(45):
                  try:
                      with engine.connect() as conn:
                          assert conn.execute(sa.text("SELECT DB_NAME()")).scalar_one() == "tempdb"
                      print("Local ephemeral SQL Server is ready")
                      break
                  except Exception:
                      if attempt == 44:
                          raise
                      time.sleep(3)
          finally:
              engine.dispose()
          PY

      - name: Run SQL Server transaction concurrency regression
        run: pytest -q tests/test_distribution_sqlserver_live_lock.py tests/test_distribution_sqlserver_live_migration.py tests/test_goods_post_row_lock.py tests/test_distribution_setup_wizard_live_sqlserver.py
