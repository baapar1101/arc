name: Task Recurrence Regression

on:
  push:
    branches:
      - master
    paths:
      - 'hesabixAPI/app/services/task_management_service.py'
      - 'hesabixAPI/tests/test_task_recurrence.py'
      - '.github/workflows/test-task-recurrence.yml'
  workflow_dispatch:

jobs:
  recurrence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hesabixAPI

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: hesabixAPI/pyproject.toml

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run recurrence regression suite
        run: pytest -q tests/test_task_recurrence.py
