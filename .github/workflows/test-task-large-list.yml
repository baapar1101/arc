name: Task Large List Regression

on:
  push:
    branches:
      - master
    paths:
      - 'hesabixUI/hesabix_ui/lib/widgets/common/bounded_sliver_list.dart'
      - 'hesabixUI/hesabix_ui/lib/pages/business/task_management/task_management_page.dart'
      - 'hesabixUI/hesabix_ui/lib/pages/business/project_workspace_page.dart'
      - 'hesabixUI/hesabix_ui/test/bounded_sliver_list_test.dart'
      - '.github/workflows/test-task-large-list.yml'
  workflow_dispatch:

jobs:
  large-list-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hesabixUI/hesabix_ui

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run large list regression suite
        run: flutter test test/bounded_sliver_list_test.dart
