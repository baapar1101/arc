name: Capture Flutter Web UI Screenshot

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/capture-ui-screenshot.yml'
  workflow_dispatch:

jobs:
  capture-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com
      PRODUCTION_URL: https://hesabix-arc.vercel.app

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Build production frontend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_web.sh
          ./build_web.sh \
            --project hesabixUI/hesabix_ui \
            --mode release \
            --clean \
            --install-deps \
            --api-base-url https://tamastore.ir

      - name: Capture compiled and deployed UI
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$GITHUB_WORKSPACE/hesabixUI/hesabix_ui/build/web"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$DIST_DIR" \
            >/tmp/hesabix-ui-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS "$PRODUCTION_URL/version.json?ci_run=$GITHUB_RUN_ID" \
            -o "$GITHUB_WORKSPACE/hesabix-production-version.json"

          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium

          cat > capture-ui.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
            ],
          });

          async function capture(url, outputName, label, requireFlutter) {
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              locale: 'en-US',
              timezoneId: 'UTC',
              serviceWorkers: 'block',
            });
            await context.addInitScript(() => {
              // shared_preferences web uses the flutter. prefix. Force a
              // supported locale for deterministic CI rendering.
              localStorage.setItem('flutter.app_locale_code', 'en-US');
            });
            const page = await context.newPage();

            page.on('console', (msg) => {
              console.log(`[${label}:browser:${msg.type()}] ${msg.text()}`);
            });
            page.on('pageerror', (error) => {
              console.error(`[${label}:pageerror] ${error.message}`);
            });
            page.on('requestfailed', (request) => {
              console.error(
                `[${label}:requestfailed] ${request.url()} :: ${request.failure()?.errorText ?? ''}`,
              );
            });

            await page.goto(url, {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });

            try {
              await page.waitForFunction(
                () => Boolean(
                  document.querySelector('flt-glass-pane') ||
                  document.querySelector('canvas'),
                ),
                null,
                { timeout: 60000 },
              );
            } catch (error) {
              if (requireFlutter) throw error;
              console.warn(
                `[${label}] Flutter surface did not appear before timeout; capturing the real deployed page state.`,
              );
            }

            await page.waitForTimeout(12000);
            console.log(`[${label}:capture] url=${page.url()} title=${await page.title()}`);
            await page.screenshot({
              path: process.env.GITHUB_WORKSPACE + '/' + outputName,
              fullPage: true,
            });
            await context.close();
          }

          await capture(
            'http://127.0.0.1:8080/',
            'hesabix-ui.png',
            'compiled',
            true,
          );
          await capture(
            process.env.PRODUCTION_URL + '/',
            'hesabix-production-ui.png',
            'production',
            false,
          );
          await browser.close();
          NODE

          node capture-ui.mjs
          test -s "$GITHUB_WORKSPACE/hesabix-ui.png"
          test -s "$GITHUB_WORKSPACE/hesabix-production-ui.png"
          test -s "$GITHUB_WORKSPACE/hesabix-production-version.json"

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: hesabix-ui-screenshot
          path: |
            hesabix-ui.png
            hesabix-production-ui.png
            hesabix-production-version.json
          if-no-files-found: error
          retention-days: 7
