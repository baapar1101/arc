name: Capture Flutter Web UI Screenshot

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/capture-ui-screenshot.yml'
  workflow_dispatch:

jobs:
  capture-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUB_HOSTED_URL: https://pub.dev
      FLUTTER_STORAGE_BASE_URL: https://storage.googleapis.com

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Flutter Web
        run: flutter config --enable-web

      - name: Build production frontend
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_web.sh
          ./build_web.sh \
            --project hesabixUI/hesabix_ui \
            --mode release \
            --clean \
            --install-deps \
            --api-base-url https://tamastore.ir

      - name: Capture compiled UI
        shell: bash
        run: |
          set -euo pipefail
          DIST_DIR="$GITHUB_WORKSPACE/hesabixUI/hesabix_ui/build/web"
          python3 -m http.server 8080 --bind 127.0.0.1 --directory "$DIST_DIR" \
            >/tmp/hesabix-ui-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            sleep 1
          done

          cd "$RUNNER_TEMP"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium

          cat > capture-ui.mjs <<'NODE'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--no-sandbox',
              '--disable-dev-shm-usage',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--use-angle=swiftshader',
            ],
          });
          const context = await browser.newContext({
            viewport: { width: 1440, height: 1000 },
            deviceScaleFactor: 1,
          });
          const page = await context.newPage();

          page.on('console', (msg) => {
            console.log(`[browser:${msg.type()}] ${msg.text()}`);
          });
          page.on('pageerror', (error) => {
            console.error(`[pageerror] ${error.message}`);
          });
          page.on('requestfailed', (request) => {
            console.error(
              `[requestfailed] ${request.url()} :: ${request.failure()?.errorText ?? ''}`,
            );
          });

          await page.goto('http://127.0.0.1:8080/', {
            waitUntil: 'domcontentloaded',
            timeout: 60000,
          });
          await page.waitForSelector('flt-glass-pane', { timeout: 60000 });
          await page.waitForTimeout(18000);
          console.log(`[capture] url=${page.url()} title=${await page.title()}`);
          await page.screenshot({
            path: process.env.GITHUB_WORKSPACE + '/hesabix-ui.png',
            fullPage: true,
          });
          await browser.close();
          NODE

          node capture-ui.mjs
          test -s "$GITHUB_WORKSPACE/hesabix-ui.png"

      - name: Upload UI screenshot
        uses: actions/upload-artifact@v4
        with:
          name: hesabix-ui-screenshot
          path: hesabix-ui.png
          if-no-files-found: error
          retention-days: 7
