name: Validate Sepidar reconciliation integration

on:
  push:
    branches:
      - integration/resolve-hesabix-conflicts-20261102
    paths:
      - 'hesabixAPI/app/services/sepidar_native_service.py'
      - 'hesabixAPI/app/services/sepidar_reconciliation_service.py'
      - 'hesabixAPI/tests/test_sepidar_native_projection.py'
      - 'hesabixAPI/tests/test_sepidar_operations.py'
      - 'hesabixAPI/tests/test_sepidar_reconciliation.py'
      - '.github/workflows/validate-sepidar-reconciliation-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sepidar-reconciliation-postgres:
    name: Sepidar reconciliation on isolated PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: integration_sepidar_test
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration_sepidar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SEPIDAR_TEST_DSN: postgresql+psycopg2://integration:integration@localhost:5432/integration_sepidar_test

    defaults:
      run:
        working-directory: hesabixAPI

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: hesabixAPI/pyproject.toml

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile changed Sepidar services and tests
        run: python -m compileall -q app/services/sepidar_native_service.py app/services/sepidar_reconciliation_service.py tests/test_sepidar_native_projection.py tests/test_sepidar_operations.py tests/test_sepidar_reconciliation.py

      - name: Run native Sepidar, operations and reviewed reconciliation tests
        run: pytest -q tests/test_sepidar_native_projection.py tests/test_sepidar_operations.py tests/test_sepidar_reconciliation.py
