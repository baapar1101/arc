name: Validate electronic Rial ledger exports

on:
  push:
    branches:
      - integration/resolve-hesabix-conflicts-20261102
    paths:
      - 'hesabixAPI/app/services/journal_ledger_electronic_export_service.py'
      - 'hesabixAPI/app/services/general_ledger_electronic_export_service.py'
      - 'hesabixAPI/tests/test_electronic_ledger_rial_fallback.py'
      - 'hesabixUI/hesabix_ui/lib/pages/business/general_ledger_report_page.dart'
      - '.github/workflows/validate-electronic-ledger-rial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Electronic ledger currency regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hesabixAPI
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: hesabixAPI/pyproject.toml
      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Verify syntax and electronic exports
        run: |
          python -m compileall -q app/services/journal_ledger_electronic_export_service.py app/services/general_ledger_electronic_export_service.py tests/test_electronic_ledger_rial_fallback.py
          pytest -q tests/test_journal_ledger_electronic_export.py tests/test_general_ledger_electronic_export.py tests/test_electronic_ledger_rial_fallback.py

  flutter:
    name: General ledger page analysis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hesabixUI/hesabix_ui
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze general ledger report page
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings lib/pages/business/general_ledger_report_page.dart
