name: Publish iOS Release

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/publish-ios-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: hesabixUI/hesabix_ui

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Read app version
        id: app
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build unsigned iOS app
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define API_BASE_URL=https://tamastore.ir

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.app.outputs.version }}"
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"

          rm -rf release-ios Payload
          mkdir -p release-ios Payload
          cp -R "$APP" Payload/

          ditto -c -k --sequesterRsrc --keepParent Payload             "release-ios/MarkStreet-${VERSION}-unsigned.ipa"

          ditto -c -k --sequesterRsrc --keepParent "$APP"             "release-ios/MarkStreet-${VERSION}-Runner.app.zip"

          shasum -a 256 release-ios/* > release-ios/SHA256SUMS-iOS.txt
          ls -lh release-ios
          cat release-ios/SHA256SUMS-iOS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: markstreet-ios-release-${{ steps.app.outputs.version }}
          path: hesabixUI/hesabix_ui/release-ios/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach iOS build to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.app.outputs.tag }}
          VERSION: ${{ steps.app.outputs.version }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "MarkStreet $VERSION"               --notes "MarkStreet mobile release $VERSION"
          fi

          gh release upload "$TAG"             hesabixUI/hesabix_ui/release-ios/*             --repo "$GITHUB_REPOSITORY"             --clobber
