name: Validate Hesabix conflict integration

on:
  push:
    branches:
      - integration/resolve-hesabix-conflicts-20261102
    paths:
      - 'hesabixUI/hesabix_ui/lib/pages/business/repair_shop/**'
      - 'hesabixUI/hesabix_ui/lib/pages/business/distribution/distribution_main_page.dart'
      - 'hesabixUI/hesabix_ui/lib/services/distribution_service.dart'
      - 'hesabixUI/hesabix_ui/lib/pages/business/distribution/distribution_tab_permissions.dart'
      - 'hesabixAPI/adapters/db/models/distribution.py'
      - 'hesabixAPI/adapters/db/models/__init__.py'
      - 'hesabixAPI/adapters/api/v1/distribution.py'
      - 'hesabixAPI/adapters/api/v1/schema_models/distribution.py'
      - 'hesabixAPI/app/services/distribution_service.py'
      - 'hesabixAPI/app/services/distribution_phase3_service.py'
      - 'hesabixAPI/app/services/distribution_field_ops_service.py'
      - 'hesabixAPI/migrations/versions/20261121_000001_distribution_daily_plan_locks.py'
      - 'hesabixAPI/migrations/versions/20261121_000002_distribution_daily_plan_snapshot.py'
      - 'hesabixAPI/tests/test_distribution_daily_plan_publication.py'
      - 'hesabixAPI/tests/test_distribution_plan_lock_guards.py'
      - 'hesabixAPI/tests/test_distribution_plan_migration_postgres.py'
      - 'hesabixUI/hesabix_ui/lib/pages/business/quick_sales_page.dart'
      - 'hesabixUI/hesabix_ui/lib/pages/business/telephony/telephony_hub_page.dart'
      - 'hesabixUI/hesabix_ui/lib/pages/business/users_permissions_page.dart'
      - 'hesabixUI/hesabix_ui/lib/widgets/document/document_details_dialog.dart'
      - 'hesabixUI/hesabix_ui/lib/widgets/marketplace/plugin_marketplace_utils.dart'
      - 'hesabixUI/hesabix_ui/lib/widgets/telephony/telephony_party.dart'
      - 'hesabixUI/hesabix_ui/lib/models/quick_sales_parked_sale.dart'
      - 'hesabixUI/hesabix_ui/lib/models/invoice_transaction.dart'
      - 'hesabixUI/hesabix_ui/lib/widgets/invoice/person_combobox_widget.dart'
      - 'hesabixUI/hesabix_ui/test/quick_sales_parked_sale_test.dart'
      - 'hesabixUI/hesabix_ui/test/telephony_party_test.dart'
      - 'hesabixUI/hesabix_ui/test/plugin_marketplace_utils_test.dart'
      - 'hesabixUI/hesabix_ui/test/distribution_tab_permissions_test.dart'
      - '.github/workflows/validate-hesabix-conflict-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-flutter-validation:
    name: Focused Flutter analysis and regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: hesabixUI/hesabix_ui

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze changed feature files
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings \
            lib/pages/business/repair_shop/repair_order_detail_page.dart \
            lib/pages/business/repair_shop/repair_technicians_page.dart \
            lib/pages/business/distribution/distribution_main_page.dart \
            lib/services/distribution_service.dart \
            lib/pages/business/distribution/distribution_tab_permissions.dart \
            lib/pages/business/quick_sales_page.dart \
            lib/pages/business/telephony/telephony_hub_page.dart \
            lib/pages/business/users_permissions_page.dart \
            lib/widgets/document/document_details_dialog.dart \
            lib/widgets/marketplace/plugin_marketplace_utils.dart \
            lib/widgets/telephony/telephony_party.dart \
            lib/models/quick_sales_parked_sale.dart \
            lib/models/invoice_transaction.dart \
            lib/widgets/invoice/person_combobox_widget.dart

      - name: Run parked-sale migration regression tests
        run: |
          flutter test --no-pub test/quick_sales_parked_sale_test.dart
          flutter test --no-pub test/telephony_party_test.dart
          flutter test --no-pub test/plugin_marketplace_utils_test.dart
          flutter test --no-pub test/distribution_tab_permissions_test.dart

  distribution-publication-backend:
    name: Distribution publication backend regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hesabixAPI

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: hesabixAPI/pyproject.toml

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify Alembic migration graph
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          script = ScriptDirectory.from_config(Config("alembic.ini"))
          migration = script.get_revision("20261121_000001_dist_plan_locks")
          assert migration is not None
          assert migration.down_revision == "20261101_000001_sepidar_reconciliation"
          snapshot = script.get_revision("20261121_000002_dist_plan_snapshot")
          assert snapshot is not None
          assert snapshot.down_revision == "20261121_000001_dist_plan_locks"
          print("Daily plan lock and snapshot migrations registered in Alembic graph")
          PY

      - name: Check backend Python syntax
        run: |
          python -m compileall -q adapters/api/v1/distribution.py adapters/api/v1/schema_models/distribution.py adapters/db/models/distribution.py app/services/distribution_service.py app/services/distribution_phase3_service.py app/services/distribution_field_ops_service.py migrations/versions/20261121_000001_distribution_daily_plan_locks.py migrations/versions/20261121_000002_distribution_daily_plan_snapshot.py

      - name: Run distribution publication regression
        run: pytest -q tests/test_distribution_daily_plan_publication.py tests/test_distribution_plan_lock_guards.py

  distribution-publication-postgres:
    name: Distribution migration on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: distribution_integration
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d distribution_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DISTRIBUTION_PG_TEST_DSN: postgresql+psycopg2://integration:integration@localhost:5432/distribution_integration

    defaults:
      run:
        working-directory: hesabixAPI

    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: hesabixAPI/pyproject.toml

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run live PostgreSQL publication migration checks
        run: pytest -q tests/test_distribution_plan_migration_postgres.py
