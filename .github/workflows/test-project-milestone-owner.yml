name: Milestone Owner Regression

on:
  push:
    branches:
      - master
    paths:
      - 'hesabixAPI/adapters/db/models/task_management.py'
      - 'hesabixAPI/app/services/project_service.py'
      - 'hesabixAPI/adapters/api/v1/schema_models/project_workspace.py'
      - 'hesabixAPI/tests/test_project_milestone_owner.py'
      - 'hesabixAPI/migrations/versions/20260929_000005_project_milestone_owner.py'
      - '.github/workflows/test-project-milestone-owner.yml'
  workflow_dispatch:

jobs:
  milestone-owner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hesabixAPI

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: hesabixAPI/pyproject.toml

      - name: Install API test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run milestone owner regression suite
        run: pytest -q tests/test_project_milestone_owner.py
