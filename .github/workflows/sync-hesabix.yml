name: Sync Hesabix upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-hesabix.yml

permissions:
  contents: write

concurrency:
  group: sync-hesabix-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Hesabix upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://source.hesabix.ir/hesabix/arc.git
          git fetch upstream master --tags --prune

      - name: Merge upstream while preserving custom UI
        shell: bash
        run: |
          set -euo pipefail
          git checkout master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already contains current upstream master."
            exit 0
          fi

          LOCAL_HEAD="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse upstream/master)"
          CUSTOM_BASE="dfa3c1ad6bcf378e2c986987db4d4fbd792a2b0d"

          echo "Merging upstream ${UPSTREAM_HEAD} into ${LOCAL_HEAD}"
          set +e
          git merge --no-ff --no-commit upstream/master
          MERGE_RC=$?
          set -e

          mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
          echo "Conflict count: ${#CONFLICTS[@]}"

          for file in "${CONFLICTS[@]}"; do
            keep_local="false"

            case "$file" in
              .github/*|\
              hesabixUI/hesabix_ui/lib/theme/*|\
              hesabixUI/hesabix_ui/lib/pages/login_page.dart|\
              hesabixUI/hesabix_ui/lib/main.dart|\
              hesabixUI/hesabix_ui/web/index.html|\
              hesabixUI/hesabix_ui/lib/widgets/auth_footer.dart)
                keep_local="true"
                ;;
            esac

            # Any file changed by the recent custom UI/glass work is treated
            # as part of the local visual overlay when it conflicts.
            if git cat-file -e "${CUSTOM_BASE}^{commit}" 2>/dev/null && \
               ! git diff --quiet "${CUSTOM_BASE}" "${LOCAL_HEAD}" -- "$file"; then
              keep_local="true"
            fi

            if [[ "$keep_local" == "true" ]]; then
              echo "KEEP LOCAL: $file"
              git checkout --ours -- "$file"
            else
              echo "TAKE UPSTREAM: $file"
              git checkout --theirs -- "$file"
            fi
            git add -- "$file"
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "Merge produced no tree changes."
            git merge --abort 2>/dev/null || true
            exit 0
          fi

          git commit -m "Merge Hesabix upstream ${UPSTREAM_HEAD:0:12} preserving custom UI"
          git push origin master

      - name: Push upstream tags
        if: success()
        run: |
          git push origin --tags
