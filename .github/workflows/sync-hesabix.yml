name: Sync Hesabix upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-hesabix.yml

permissions:
  contents: write

concurrency:
  group: sync-hesabix-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch Hesabix upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://source.hesabix.ir/hesabix/arc.git
          git fetch upstream master --tags --prune

      - name: Merge upstream while preserving custom UI
        shell: bash
        run: |
          set -euo pipefail
          git checkout master

          apply_glass_modals() {
            python3 - <<'PY'
          from pathlib import Path
          import re
          
          root = Path("hesabixUI/hesabix_ui/lib")
          glass_file = root / "theme" / "glass.dart"
          dialog_re = re.compile(r"\bshowDialog(?=\s*(?:<|\())")
          sheet_re = re.compile(r"\bshowModalBottomSheet(?=\s*(?:<|\())")
          glass_import_re = re.compile(
              r"^import\s+['\"][^'\"]*theme/glass\.dart['\"];\s*$",
              re.MULTILINE,
          )
          first_import_re = re.compile(r"^import\s+['\"][^'\"]+['\"];\s*$", re.MULTILINE)
          package_import = "import 'package:hesabix_ui/theme/glass.dart';\n"
          
          changed = []
          for path in root.rglob("*.dart"):
              if path == glass_file or path.name.endswith(".dart.backup"):
                  continue
          
              original = path.read_text(encoding="utf-8")
              updated = dialog_re.sub("showGlassDialog", original)
              updated = sheet_re.sub("showGlassModalBottomSheet", updated)
          
              if updated == original:
                  continue
          
              if not glass_import_re.search(updated):
                  match = first_import_re.search(updated)
                  if match:
                      updated = updated[:match.start()] + package_import + updated[match.start():]
                  else:
                      updated = package_import + updated
          
              path.write_text(updated, encoding="utf-8")
              changed.append(str(path))
          
          print(f"Glass-normalized {len(changed)} Dart files")
          for item in changed:
              print(item)
          PY
          }

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already contains current upstream master."
            apply_glass_modals
            if ! git diff --quiet; then
              git add hesabixUI/hesabix_ui/lib
              git commit -m "Reapply glass modals across updated UI"
              git push origin master
            fi
            exit 0
          fi

          LOCAL_HEAD="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse upstream/master)"

          echo "Merging upstream ${UPSTREAM_HEAD} into ${LOCAL_HEAD}"
          set +e
          git merge --no-ff --no-commit upstream/master
          MERGE_RC=$?
          set -e

          mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
          echo "Conflict count: ${#CONFLICTS[@]}"

          for file in "${CONFLICTS[@]}"; do
            case "$file" in
              hesabixUI/hesabix_ui/lib/main.dart)
                echo "::error::main.dart has an upstream conflict and needs explicit integration."
                exit 1
                ;;
              .github/*|\
              hesabixUI/hesabix_ui/lib/theme/*|\
              hesabixUI/hesabix_ui/lib/pages/login_page.dart|\
              hesabixUI/hesabix_ui/web/index.html|\
              hesabixUI/hesabix_ui/lib/widgets/auth_footer.dart|\
              hesabixUI/hesabix_ui/pubspec.yaml|\
              hesabixUI/hesabix_ui/lib/utils/error_extractor.dart|\
              hesabixUI/hesabix_ui/assets/images/*|\
              build_web.sh)
                echo "KEEP PRESENTATION: $file"
                git checkout --ours -- "$file"
                ;;
              *)
                echo "TAKE UPSTREAM FUNCTIONAL SOURCE: $file"
                git checkout --theirs -- "$file"
                ;;
            esac
            git add -- "$file"
          done

          # Even when Git merged these cleanly, the fork owns these presentation
          # files. Restore them exactly from the pre-merge local head.
          git checkout "$LOCAL_HEAD" -- \
            .github \
            hesabixUI/hesabix_ui/lib/theme \
            hesabixUI/hesabix_ui/lib/pages/login_page.dart \
            hesabixUI/hesabix_ui/web/index.html \
            hesabixUI/hesabix_ui/lib/widgets/auth_footer.dart \
            hesabixUI/hesabix_ui/pubspec.yaml \
            hesabixUI/hesabix_ui/lib/utils/error_extractor.dart \
            hesabixUI/hesabix_ui/assets/images \
            build_web.sh
          git add \
            .github \
            hesabixUI/hesabix_ui/lib/theme \
            hesabixUI/hesabix_ui/lib/pages/login_page.dart \
            hesabixUI/hesabix_ui/web/index.html \
            hesabixUI/hesabix_ui/lib/widgets/auth_footer.dart \
            hesabixUI/hesabix_ui/pubspec.yaml \
            hesabixUI/hesabix_ui/lib/utils/error_extractor.dart \
            hesabixUI/hesabix_ui/assets/images \
            build_web.sh

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge conflicts remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          apply_glass_modals
          git add hesabixUI/hesabix_ui/lib

          if git diff --cached --quiet; then
            echo "Merge produced no tree changes."
            git merge --abort 2>/dev/null || true
            exit 0
          fi

          git commit -m "Merge Hesabix upstream ${UPSTREAM_HEAD:0:12} preserving custom UI"
          git push origin master

      - name: Push upstream tags
        if: success()
        run: |
          git push origin --tags
