# Frontend-only nginx container behind the API reverse proxy.
# Mount at /etc/nginx/conf.d/default.conf when creating the container.
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA deep links internally redirect here. Revalidate HTML so an old index
    # cannot keep referencing an obsolete content-addressed Flutter build.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~ ^/(version\.json|flutter_service_worker\.js|flutter_bootstrap\.js|main\.dart\.js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }
    location ~ "^/(main\.[a-f0-9]{16}\.dart\.js|flutter_bootstrap\.[a-f0-9]{16}\.js)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
